spring:
  application:
    name: answerbase-api
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/answerbase}
    username: ${DATABASE_USERNAME:answerbase}
    password: ${DATABASE_PASSWORD:answerbase-local}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
