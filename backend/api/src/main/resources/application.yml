spring:
  application:
    name: answerbase-api
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/answerbase}
    username: ${DATABASE_USERNAME:answerbase}
    password: ${DATABASE_PASSWORD:answerbase-local}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: false
  show-actuator: true
  paths-to-match:
    - /api/**
    - /actuator/health
    - /actuator/health/**

answerbase:
  auth:
    issuer: ${SUPABASE_AUTH_ISSUER:}
    jwk-set-uri: ${SUPABASE_JWKS_URL:}
