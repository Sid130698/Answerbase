spring:
  task:
    scheduling:
      pool:
        size: 2
  application:
    name: answerbase-worker
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/answerbase}
    username: ${DATABASE_USERNAME:answerbase}
    password: ${DATABASE_PASSWORD:answerbase-local}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
  flyway:
    enabled: false
    locations: classpath:db/migration
    clean-disabled: true
server:
  port: ${PORT:8081}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

# Identical storage configuration is required in API and worker.
documents:
  storage:
    provider: ${DOCUMENT_STORAGE_PROVIDER:local}
    root: ${DOCUMENT_STORAGE_ROOT:.cache/documents}
    url: ${DOCUMENT_STORAGE_URL:}
    bucket: ${DOCUMENT_STORAGE_BUCKET:answerbase-documents}
    secret: ${DOCUMENT_STORAGE_SERVICE_KEY:}
