<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1150" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">Answerbase unified system architecture</title><desc id="architecture-desc">Browser calls Spring Boot. Spring Boot authenticates requests, retrieves permitted evidence from PostgreSQL, calls Groq and validates answers. An isolated worker polls the Postgres job queue and indexes documents from private storage. Authentication and generation providers are external. Evaluation tooling targets a separate test environment.</desc>
<defs><marker id="arch-q" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087f78"/></marker><marker id="arch-i" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4262be"/></marker><marker id="arch-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#778391"/></marker></defs>
<rect width="1340" height="1150" fill="#fbfcfe"/>
