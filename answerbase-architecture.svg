<rect x="500" y="24" width="320" height="64" rx="12" fill="#e7f0f3" stroke="#c5d6dc" stroke-width="1.5"/><text x="520" y="48" font-size="10" fill="#647783" font-weight="700" text-anchor="start">ACTOR</text><text x="520" y="75" font-size="20" fill="#172c38" font-weight="700" text-anchor="start">Team member / administrator</text><rect x="500" y="145" width="320" height="108" rx="12" fill="white" stroke="#c5d6dc" stroke-width="1.5"/><text x="520" y="169" font-size="10" fill="#647783" font-weight="700" text-anchor="start">CLIENT · CLOUDFLARE STATIC HOSTING</text><text x="520" y="196" font-size="20" fill="#172c38" font-weight="700" text-anchor="start">React web application</text><text x="520" y="222" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Chat · Source viewer · Admin console</text><text x="520" y="243" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Runs in the user’s browser</text><rect x="1000" y="92" width="290" height="120" rx="12" fill="#f3eef9" stroke="#c5d6dc" stroke-width="1.5"/><text x="1020" y="116" font-size="10" fill="#647783" font-weight="700" text-anchor="start">IDENTITY PROVIDER</text><text x="1020" y="143" font-size="20" fill="#172c38" font-weight="700" text-anchor="start">Supabase Auth</text><text x="1020" y="169" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Self-signup, verification, and tokens</text><text x="1020" y="190" font-size="13" fill="#526672" font-weight="400" text-anchor="start">API verifies JWT using cached keys</text><rect x="500" y="355" width="320" height="190" rx="12" fill="white" stroke="#c5d6dc" stroke-width="1.5"/><text x="520" y="379" font-size="10" fill="#647783" font-weight="700" text-anchor="start">ONLINE APPLICATION</text><text x="520" y="406" font-size="20" fill="#172c38" font-weight="700" text-anchor="start">Spring Boot API</text><text x="520" y="432" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Validate identity + resolve permissions</text><text x="520" y="453" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Local query embedding → hybrid search</text><text x="520" y="474" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Optional local rerank → call Groq</text><text x="520" y="495" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Validate citations → return response</text><text x="520" y="516" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Upload orchestration · Logs · Feedback</text><rect x="1000" y="355" width="290" height="147" rx="12" fill="#f3eef9" stroke="#c5d6dc" stroke-width="1.5"/><text x="1020" y="379" font-size="10" fill="#647783" font-weight="700" text-anchor="start">GENERATION PROVIDER</text><text x="1020" y="406" font-size="20" fill="#172c38" font-weight="700" text-anchor="start">Groq API</text><text x="1020" y="432" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Question + selected evidence in</text><text x="1020" y="453" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Candidate answer + citations out</text><text x="1020" y="474" font-size="13" fill="#526672" font-weight="400" text-anchor="start">No database or storage access</text><rect x="110" y="620" width="300" height="175" rx="12" fill="white" stroke="#c5d6dc" stroke-width="1.5"/><text x="130" y="644" font-size="10" fill="#647783" font-weight="700" text-anchor="start">BACKGROUND PROCESS · ISOLATED</text><text x="130" y="671" font-size="20" fill="#172c38" font-weight="700" text-anchor="start">Ingestion worker</text><text x="130" y="697" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Lease queued jobs with retries</text><text x="130" y="718" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Read original → parse → chunk</text><text x="130" y="739" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Generate document embeddings locally</text><text x="130" y="760" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Publish complete indexed version</text><rect x="500" y="925" width="320" height="135" rx="12" fill="white" stroke="#c5d6dc" stroke-width="1.5"/><text x="520" y="949" font-size="10" fill="#647783" font-weight="700" text-anchor="start">DATABASE · ONE POSTGRES INSTANCE</text><text x="520" y="976" font-size="20" fill="#172c38" font-weight="700" text-anchor="start">PostgreSQL + pgvector</text><text x="520" y="1002" font-size="13" fill="#526672" font-weight="400" text-anchor="start">ACLs · Versions · Chunks · Search</text><text x="520" y="1023" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Job queue · Status · Query metrics</text><text x="520" y="1044" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Keyword + vector indexes</text><rect x="110" y="925" width="300" height="135" rx="12" fill="white" stroke="#c5d6dc" stroke-width="1.5"/><text x="130" y="949" font-size="10" fill="#647783" font-weight="700" text-anchor="start">OBJECT STORAGE · PRIVATE BUCKET</text><text x="130" y="976" font-size="20" fill="#172c38" font-weight="700" text-anchor="start">Original documents</text><text x="130" y="1002" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Immutable uploaded file versions</text><text x="130" y="1023" font-size="13" fill="#526672" font-weight="400" text-anchor="start">PDF / DOCX / Markdown / HTML / text</text><text x="130" y="1044" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Access mediated by the API</text><rect x="1000" y="675" width="290" height="130" rx="12" fill="#fff" stroke="#c5d6dc" stroke-width="1.5"/><text x="1020" y="699" font-size="10" fill="#647783" font-weight="700" text-anchor="start">LOCAL / CI TOOLING</text><text x="1020" y="726" font-size="20" fill="#172c38" font-weight="700" text-anchor="start">Evaluation harness</text><text x="1020" y="752" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Gold questions + adversarial cases</text><text x="1020" y="773" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Quality regression + isolation tests</text><text x="1020" y="794" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Reports gate deployment</text><rect x="1000" y="905" width="290" height="135" rx="12" fill="white" stroke="#c5d6dc" stroke-width="1.5"/><text x="1020" y="929" font-size="10" fill="#647783" font-weight="700" text-anchor="start">NON-PRODUCTION TARGET</text><text x="1020" y="956" font-size="20" fill="#172c38" font-weight="700" text-anchor="start">Isolated test environment</text><text x="1020" y="982" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Same API + worker implementation</text><text x="1020" y="1003" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Separate test corpus and database</text><text x="1020" y="1024" font-size="13" fill="#526672" font-weight="400" text-anchor="start">No requests against customer data</text><path d="M660 88V145" fill="none" stroke="#087f78" stroke-width="2"/><polygon points="660,145 654,134 666,134" fill="#087f78"/><rect x="672" y="103" width="42.4" height="22" rx="4" fill="#fbfcfe"/><text x="678" y="117" font-size="12" fill="#526672" font-weight="400" text-anchor="start">Uses</text><path d="M820 184H1000" fill="none" stroke="#778391" stroke-width="2" stroke-dasharray="6 4"/><polygon points="1000,184 989,178 989,190" fill="#778391"/><rect x="839" y="152" width="167.79999999999998" height="22" rx="4" fill="#fbfcfe"/><text x="845" y="166" font-size="12" fill="#526672" font-weight="400" text-anchor="start">Sign up / sign in · JWT</text><path d="M660 253V355" fill="none" stroke="#087f78" stroke-width="2"/><polygon points="660,355 654,344 666,344" fill="#087f78"/><rect x="672" y="270" width="194.2" height="40" rx="4" fill="#fbfcfe"/><text x="678" y="284" font-size="12" fill="#526672" font-weight="400" text-anchor="start">HTTPS + access token</text><text x="678" y="302" font-size="12" fill="#526672" font-weight="400" text-anchor="start">Queries · Uploads · Sources</text><path d="M820 427H1000" fill="none" stroke="#087f78" stroke-width="2"/><polygon points="1000,427 989,421 989,433" fill="#087f78"/><rect x="839" y="385" width="154.6" height="40" rx="4" fill="#fbfcfe"/><text x="845" y="399" font-size="12" fill="#526672" font-weight="400" text-anchor="start">Generate answer</text><text x="845" y="417" font-size="12" fill="#526672" font-weight="400" text-anchor="start">HTTPS · evidence only</text><path d="M660 545V925" fill="none" stroke="#087f78" stroke-width="2"/><polygon points="660,925 654,914 666,914" fill="#087f78"/><rect x="674" y="676" width="235" height="58" rx="4" fill="#fbfcfe"/><text x="680" y="690" font-size="12" fill="#526672" font-weight="400" text-anchor="start">SQL reads + writes / TLS</text><text x="680" y="708" font-size="12" fill="#526672" font-weight="400" text-anchor="start">Read: permitted passages + ACLs</text><text x="680" y="726" font-size="12" fill="#526672" font-weight="400" text-anchor="start">Write: jobs + traces + membership</text><path d="M500 510H42V992H110" fill="none" stroke="#4262be" stroke-width="2"/><polygon points="110,992 99,986 99,998" fill="#4262be"/><text transform="translate(29 860) rotate(-90)" font-size="12" fill="#4262be">API stores uploads / reads authorized originals</text><path d="M260 795V925" fill="none" stroke="#4262be" stroke-width="2"/><polygon points="260,925 254,914 266,914" fill="#4262be"/><rect x="104" y="821" width="148.0" height="22" rx="4" fill="#fbfcfe"/><text x="110" y="835" font-size="12" fill="#526672" font-weight="400" text-anchor="start">Read stored original</text><path d="M410 702H550V925" fill="none" stroke="#4262be" stroke-width="2"/><polygon points="550,925 544,914 556,914" fill="#4262be"/><rect x="359" y="826" width="183" height="58" rx="4" fill="#fbfcfe"/><text x="365" y="840" font-size="12" fill="#526672" font-weight="400" text-anchor="start">SQL reads + writes / TLS</text><text x="365" y="858" font-size="12" fill="#526672" font-weight="400" text-anchor="start">Read / lease jobs</text><text x="365" y="876" font-size="12" fill="#526672" font-weight="400" text-anchor="start">Write chunks + status</text><path d="M1145 805V905" fill="none" stroke="#778391" stroke-width="2" stroke-dasharray="6 4"/><polygon points="1145,905 1139,894 1151,894" fill="#778391"/><rect x="1154" y="837" width="148.0" height="22" rx="4" fill="#fbfcfe"/><text x="1160" y="851" font-size="12" fill="#526672" font-weight="400" text-anchor="start">Exercise and measure</text><text x="115" y="378" font-size="11" fill="#4262be" font-weight="700" text-anchor="start">ASYNCHRONOUS HANDOFF</text><text x="115" y="407" font-size="15" fill="#172c38" font-weight="600" text-anchor="start">API enqueues in PostgreSQL.</text><text x="115" y="433" font-size="15" fill="#172c38" font-weight="600" text-anchor="start">Worker polls and leases jobs.</text><text x="115" y="466" font-size="13" fill="#526672" font-weight="400" text-anchor="start">No direct API-to-worker request.</text><text x="115" y="488" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Database job state survives restarts.</text><text x="115" y="538" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Shared model configuration;</text><text x="115" y="559" font-size="13" fill="#526672" font-weight="400" text-anchor="start">embeddings run inside each process.</text><text x="100" y="1122" font-size="13" fill="#526672" font-weight="400" text-anchor="start">Double arrows = request / response, not server-initiated calls. Blue = ingestion / files; dashed = identity / engineering paths.</text><polygon points="820,184 831,178 831,190" fill="#778391"/><polygon points="660,253 654,264 666,264" fill="#087f78"/><polygon points="820,427 831,421 831,433" fill="#087f78"/><polygon points="660,545 654,556 666,556" fill="#087f78"/><polygon points="500,510 489,504 489,516" fill="#4262be"/><polygon points="260,795 254,806 266,806" fill="#4262be"/><polygon points="410,702 421,696 421,708" fill="#4262be"/><polygon points="1145,805 1139,816 1151,816" fill="#778391"/><path d="M1210 212V270" fill="none" stroke="#778391" stroke-width="2"/><polygon points="1210,270 1204,259 1216,259" fill="#778391"/><rect x="1000" y="270" width="290" height="54" rx="9" fill="white" stroke="#c5d6dc"/><text x="1016" y="292" font-size="13" font-weight="700" fill="#172c38">Email delivery · Custom SMTP</text><text x="1016" y="311" font-size="12" fill="#526672">Auth sends verification / login emails</text></g></svg>