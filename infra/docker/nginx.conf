server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Content-Security-Policy "frame-ancestors 'self' ${SUPPORT_ORIGIN}" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    location /api/v1/support/ { return 404; }
    location /actuator/health {
        proxy_pass ${CUSTOMER_API_UPSTREAM};
    }
    location /swagger-ui {
        proxy_pass ${CUSTOMER_API_UPSTREAM};
        proxy_set_header Host $http_host;
    }
    location /v3/api-docs {
        proxy_pass ${CUSTOMER_API_UPSTREAM};
        proxy_set_header Host $http_host;
    }
    location /api/ {
        proxy_pass ${CUSTOMER_API_UPSTREAM};
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
