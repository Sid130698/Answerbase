#cloud-config
package_update: true
packages: [ca-certificates, curl, git, python3, xz-utils]
write_files:
  - path: /usr/local/sbin/answerbase-bootstrap
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      source /etc/os-release
      arch=$(dpkg --print-architecture)
      echo "deb [arch=$arch signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" > /etc/apt/sources.list.d/docker.list
      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker
      usermod -aG docker ubuntu
      node_dir=$(mktemp -d)
      cd "$node_dir"
      curl -fsSL https://nodejs.org/dist/latest-v24.x/SHASUMS256.txt -o SHASUMS256.txt
      node_archive=$(awk '/node-v[0-9.]+-linux-arm64.tar.xz$/ {print $2}' SHASUMS256.txt)
      test -n "$node_archive"
      curl -fsSL "https://nodejs.org/dist/latest-v24.x/$node_archive" -o "$node_archive"
      grep "  $node_archive$" SHASUMS256.txt | sha256sum --check -
      tar -xJf "$node_archive" --strip-components=1 -C /usr/local
      install -d -o ubuntu -g ubuntu /opt/answerbase
      # OCI Ubuntu's host firewall can reject HTTP even when the cloud security list permits it.
      iptables -I INPUT 1 -p tcp --dport 80 -j ACCEPT
      iptables -I INPUT 1 -p tcp --dport 443 -j ACCEPT
      if command -v netfilter-persistent >/dev/null; then netfilter-persistent save; fi
runcmd:
  - [/usr/local/sbin/answerbase-bootstrap]
