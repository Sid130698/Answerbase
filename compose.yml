name: answerbase
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-answerbase}
      POSTGRES_USER: ${POSTGRES_USER:-answerbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-answerbase-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: api
    environment: &database-environment
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:latest}
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-ollama}
      GENERATION_MODEL: ${GENERATION_MODEL:-llama3.1:8b}
      GENERATION_URL: ${GENERATION_URL:-https://api.groq.com/openai/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      RERANKER_URL: ${RERANKER_URL:-http://host.docker.internal:8092}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      RETRIEVAL_CANDIDATES: ${RETRIEVAL_CANDIDATES:-30}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-6}
      RETRIEVAL_RERANK: ${RETRIEVAL_RERANK:-false}
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-answerbase}
      DATABASE_USERNAME: ${POSTGRES_USER:-answerbase}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-answerbase-local}
      DOCUMENT_STORAGE_PROVIDER: ${DOCUMENT_STORAGE_PROVIDER:-local}
      DOCUMENT_STORAGE_ROOT: /app/documents
      DOCUMENT_STORAGE_URL: ${DOCUMENT_STORAGE_URL:-}
      DOCUMENT_STORAGE_BUCKET: ${DOCUMENT_STORAGE_BUCKET:-answerbase-documents}
      DOCUMENT_STORAGE_SERVICE_KEY: ${DOCUMENT_STORAGE_SERVICE_KEY:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      SUPABASE_AUTH_ISSUER: ${SUPABASE_AUTH_ISSUER:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
    volumes:
      - document-data:/app/documents
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
  worker:
    mem_limit: 512m
    restart: on-failure
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: worker
    environment: *database-environment
    volumes:
      - document-data:/app/documents
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    # Management port is internal only. No public worker ingress.
  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_SUPPORT_ORIGIN: ${SUPPORT_ORIGIN:-http://localhost:5174}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    environment:
      SUPPORT_ORIGIN: ${SUPPORT_ORIGIN:-http://localhost:5174}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
  support-frontend:
    build:
      context: .
      dockerfile: infra/docker/support-frontend.Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_CUSTOMER_ORIGIN: ${CUSTOMER_ORIGIN:-http://localhost:5173}
    ports:
      - "127.0.0.1:${SUPPORT_FRONTEND_PORT:-5174}:8080"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  document-data:
