name: Live model quality
on:
  pull_request:
    paths: ['backend/**', 'evals/**', 'scripts/ci-evaluation-bootstrap.mjs', '.github/workflows/live-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ matrix.revision == 'baseline' && (github.event.pull_request.base.sha || github.sha) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'app/backend/**/pom.xml'
      - name: Start local models without hosted credentials
        run: |
          curl --location --fail --silent --show-error --retry 3 https://ollama.com/install.sh -o /tmp/install-ollama.sh
          test -s /tmp/install-ollama.sh
          sh /tmp/install-ollama.sh
          if ! curl --fail --silent http://localhost:11434/api/tags; then nohup ollama serve > /tmp/ollama.log 2>&1 & fi
          for attempt in {1..30}; do curl --fail --silent http://localhost:11434/api/tags && break; sleep 2; done
          curl --fail --silent http://localhost:11434/api/tags
          ollama pull nomic-embed-text:latest
          ollama pull llama3.1:8b
      - name: Use the same evaluation harness for both revisions
        run: cp -a harness/evals/. app/evals/
      - name: Start disposable authenticated application
        working-directory: app
        run: node ../harness/scripts/ci-evaluation-bootstrap.mjs
      - name: Evaluate current application against shared candidate cases
        working-directory: app
        env:
          JUDGE_TIMEOUT_MS: 600000
          EVAL_MODE: answers
          EVAL_VARIANT: hybrid
          EVAL_IDS: fact-01,fact-02,table-01,synthesis-01,unanswerable-01,unanswerable-02,adversarial-01,adversarial-02
          EVAL_REPORT: evals/reports/answers.json
        run: |
          node evals/run.mjs
          node evals/judge.mjs evals/reports/answers.json
          curl --fail --silent http://localhost:11434/api/tags > evals/reports/models.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-quality-${{ matrix.revision }}
          path: app/evals/reports/*.json
          retention-days: 7
  regression:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: live-quality-*
          path: reports
      - name: Reject model drift and quality regressions over three points
        run: |
          node scripts/compare-model-digests.mjs reports/live-quality-baseline/models.json reports/live-quality-candidate/models.json
          node evals/check-regression.mjs reports/live-quality-baseline/answers.json reports/live-quality-candidate/answers.json reports/live-quality-baseline/answers.judge.json reports/live-quality-candidate/answers.judge.json
